name: Build APKs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack source.zip
        run: unzip -oq source.zip && ls

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (TV light + phone full)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleLightRelease assembleFullRelease --no-daemon -x test -x lint

      - name: Rename APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/light/release/*.apk out/channel-z-tv-light.apk
          cp android/app/build/outputs/apk/full/release/*.apk  out/channel-z-tv-full.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: channel-z-tv-apks
          path: out/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
