name: Build APKs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Version comes from the git tag: v1.2.3 -> versionName 1.2.3, versionCode 10203.
      # Untagged builds use the most recent tag (or 1.0.0 if there is none yet).
      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//' || true)"
            TAG="${TAG:-1.0.0}"
          fi
          IFS=. read -r MA MI PA <<< "$TAG"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          echo "name=$TAG"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building version $TAG (code $CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (TV light + phone full)
        working-directory: android
        env:
          APP_VERSION_NAME: ${{ steps.ver.outputs.name }}
          APP_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew assembleLightRelease assembleFullRelease --no-daemon -x test -x lint

      - name: Rename APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/light/release/*.apk out/dead-air-light.apk
          cp android/app/build/outputs/apk/full/release/*.apk  out/dead-air-full.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dead-air-apks
          path: out/*.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true

      # Rewrite version.json on main so installed apps see the new release.
      - name: Update version.json (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NAME: ${{ steps.ver.outputs.name }}
          CODE: ${{ steps.ver.outputs.code }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin main
          git checkout main
          BASE="https://github.com/$REPO/releases/download/v$NAME"
          cat > version.json <<JSON
          {
            "version": "$NAME",
            "versionCode": $CODE,
            "apk": "dead-air-full.apk",
            "lightApk": "dead-air-light.apk",
            "url": "$BASE/dead-air-full.apk",
            "lightUrl": "$BASE/dead-air-light.apk",
            "notes": "Dead Air v$NAME — see https://github.com/$REPO/releases/tag/v$NAME",
            "minAndroid": 7,
            "publishedAt": "$(date -u +%Y-%m-%d)"
          }
          JSON
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add version.json
          git commit -m "Release v$NAME: update version.json" || echo "version.json unchanged"
          git push origin main
