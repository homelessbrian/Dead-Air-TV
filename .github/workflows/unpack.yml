name: Unpack source.zip into repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Unzip and commit
        run: |
          unzip -oq source.zip
          rm source.zip
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Unpack source.zip into repository"
          git push
